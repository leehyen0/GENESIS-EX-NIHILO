name: arte-meta-repair-ontology-genesis

on:
  push:
    branches:
      - agent/generative-large-scale-campaign-20260929
    paths:
      - 'evaluations/run_meta_repair_ontology_genesis.py'
      - '.github/workflows/arte-meta-repair-ontology-genesis.yml'
      - 'research/ARTE_META_REPAIR_ONTOLOGY_GENESIS_PRECOMMIT_20260929.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ontology-genesis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        seed: [20260929011, 20260929012, 20260929013]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile evaluator
        run: python -m py_compile evaluations/run_meta_repair_ontology_genesis.py
      - name: Execute ontology genesis
        run: |
          mkdir -p artifacts/meta-repair-ontology
          set -o pipefail
          PYTHONPATH=. python evaluations/run_meta_repair_ontology_genesis.py --seed ${{ matrix.seed }} | tee artifacts/meta-repair-ontology/result-${{ matrix.seed }}.jsonl
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-repair-ontology-${{ matrix.seed }}
          path: artifacts/meta-repair-ontology/
          if-no-files-found: error
          retention-days: 30
