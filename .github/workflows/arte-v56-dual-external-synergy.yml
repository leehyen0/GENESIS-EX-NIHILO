name: arte-v56-dual-external-synergy
on:
  push:
    branches:
      - arte-v56-dual-external-synergy
    paths:
      - 'arte_external_replay/v56_synergy_trigger.json'
      - 'arte_external_replay/v56_synergy_runner.py'
      - 'arte_external_replay/v56_g2064_evidence.json'
      - '.github/workflows/arte-v56-dual-external-synergy.yml'
  workflow_dispatch:
jobs:
  synergy-epoch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run one cold-restored dual-external synergy epoch
        run: python arte_external_replay/v56_synergy_runner.py arte_external_replay/v56_synergy_trigger.json arte_external_replay/v56_g2064_evidence.json v56_output
      - name: Verify continuity plus calibration synergy
        shell: python
        run: |
          import json,hashlib
          from pathlib import Path
          d=Path('v56_output')
          r=json.loads((d/'epoch_receipt.json').read_text())
          s=json.loads((d/'checkpoint_state.json').read_text())
          m=json.loads((d/'hash_manifest.json').read_text())
          assert r['hosted_external'] is True
          assert r['actual_success'] is True
          assert r['cold_restore_verified'] is True
          assert r['child_state_sha256']==s['state_sha256']
          assert r['synergy_credit_total']==r['epoch']-8
          full=r['synergy_metrics']['full']
          assert full['false_authority_rate'] <= 0.08
          assert full['utility_per_case'] > r['synergy_metrics']['no_continuity']['utility_per_case'] + 0.20
          assert full['utility_per_case'] > r['synergy_metrics']['no_calibration']['utility_per_case'] + 0.08
          for v in r['claim_flags'].values(): assert v is False
          for x in m['files']:
              assert hashlib.sha256((d/x['name']).read_bytes()).hexdigest()==x['sha256']
          print('v56 dual-external synergy epoch verified')
      - uses: actions/upload-artifact@v4
        with:
          name: arte-v56-synergy-epoch
          path: v56_output/
