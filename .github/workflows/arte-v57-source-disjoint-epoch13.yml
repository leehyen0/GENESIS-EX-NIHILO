name: arte-v57-source-disjoint-epoch13
on:
  push:
    branches: [arte-v57-source-disjoint-crossnovel]
    paths:
      - 'arte_external_replay/v57_epoch13_trigger.json'
      - '.github/workflows/arte-v57-source-disjoint-epoch13.yml'
  workflow_dispatch:
jobs:
  epoch13:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run source-disjoint external ARC epoch 13
        run: python arte_external_replay/v57_source_disjoint_runner.py arte_external_replay/v57_epoch13_trigger.json v57_output
      - name: Verify target isolation, generated program, wrong control, and continuity
        shell: python
        run: |
          import json,hashlib
          from pathlib import Path
          d=Path('v57_output');r=json.loads((d/'epoch_receipt.json').read_text());s=json.loads((d/'checkpoint_state.json').read_text());e=json.loads((d/'external_evaluation.json').read_text());m=json.loads((d/'hash_manifest.json').read_text())
          assert r['epoch']==13 and r['hosted_external'] is True and r['actual_success'] is True
          assert r['source_owner']=='fchollet' and r['source_repo']=='ARC-AGI'
          assert e['selection_used_test_output'] is False and e['target_hidden_until_after_prediction'] is True
          assert e['novel_operator_generated'] is True and e['frozen_simple_program_available'] is False
          assert e['remove_generated_operator_success'] is False and e['wrong_operator_success'] is False
          assert r['child_state_sha256']==s['state_sha256']
          for v in r['claim_flags'].values(): assert v is False
          for x in m['files']: assert hashlib.sha256((d/x['name']).read_bytes()).hexdigest()==x['sha256']
          print('v57 epoch13 verified')
      - uses: actions/upload-artifact@v4
        with:
          name: arte-v57-epoch13
          path: v57_output/
