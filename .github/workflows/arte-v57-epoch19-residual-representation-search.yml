name: arte-v57-epoch19-residual-representation-search
on:
  push:
    paths:
      - '.github/workflows/arte-v57-epoch19-residual-representation-search.yml'
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile arte_external_replay/v57_epoch19_residual_representation_search.py
      - run: python arte_external_replay/v57_epoch19_residual_representation_search.py
      - uses: actions/upload-artifact@v4
        with:
          name: arte-v57-epoch19-residual-representation-search
          path: diag_output2
