name: arte-equivalence-criterion-genesis

on:
  pull_request:
    paths:
      - 'arte_cognition/equivalence_criterion_genesis.py'
      - 'arte_cognition/test_equivalence_criterion_genesis.py'
      - 'arte_cognition/test_equivalence_criterion_restart.py'
      - 'evaluations/run_equivalence_criterion_transfer.py'
      - '.github/workflows/arte-equivalence-criterion-genesis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equivalence-criterion-frontier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile equivalence frontier
        run: |
          python -m py_compile arte_cognition/equivalence_criterion_genesis.py
          python -m py_compile arte_cognition/test_equivalence_criterion_genesis.py
          python -m py_compile arte_cognition/test_equivalence_criterion_restart.py
          python -m py_compile evaluations/run_equivalence_criterion_transfer.py
      - name: Run focused equivalence contract
        run: |
          python -m unittest arte_cognition.test_equivalence_criterion_genesis -v
          python -m unittest arte_cognition.test_equivalence_criterion_restart -v
