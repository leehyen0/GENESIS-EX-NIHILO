name: arte-multigeneration-cross-layer-heredity

on:
  push:
    branches:
      - agent/generative-large-scale-campaign-20260929
    paths:
      - 'evaluations/run_multigeneration_cross_layer_heredity.py'
      - '.github/workflows/arte-multigeneration-cross-layer-heredity.yml'
      - 'research/ARTE_MULTIGENERATION_CROSS_LAYER_HEREDITY_PRECOMMIT_20260929.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multigen-cross-layer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seed: [20260929801, 20260929802, 20260929803, 20260929804]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile evaluator
        run: python -m py_compile evaluations/run_multigeneration_cross_layer_heredity.py
      - name: Execute three-generation heredity
        run: |
          mkdir -p artifacts/multigen-cross-layer
          set -o pipefail
          PYTHONPATH=. python evaluations/run_multigeneration_cross_layer_heredity.py --seed ${{ matrix.seed }} | tee artifacts/multigen-cross-layer/result-${{ matrix.seed }}.jsonl
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multigen-cross-layer-${{ matrix.seed }}
          path: artifacts/multigen-cross-layer/
          if-no-files-found: error
          retention-days: 30
