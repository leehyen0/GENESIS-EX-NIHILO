name: arte-polynomial-relation-genesis

on:
  pull_request:
    paths:
      - 'arte_cognition/polynomial_relation_genesis.py'
      - 'arte_cognition/test_polynomial_relation_genesis.py'
      - 'arte_cognition/test_polynomial_relation_restart.py'
      - 'evaluations/run_polynomial_relation_transfer.py'
      - '.github/workflows/arte-polynomial-relation-genesis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  polynomial-relation-frontier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile polynomial relation frontier
        run: |
          python -m py_compile arte_cognition/polynomial_relation_genesis.py
          python -m py_compile arte_cognition/test_polynomial_relation_genesis.py
          python -m py_compile arte_cognition/test_polynomial_relation_restart.py
          python -m py_compile evaluations/run_polynomial_relation_transfer.py
      - name: Run focused polynomial relation contract
        run: |
          python -m unittest arte_cognition.test_polynomial_relation_genesis -v
          python -m unittest arte_cognition.test_polynomial_relation_restart -v
