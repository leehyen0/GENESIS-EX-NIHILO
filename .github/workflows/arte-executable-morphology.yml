name: arte-executable-morphology

on:
  pull_request:
    paths:
      - 'arte_cognition/executable_morphology.py'
      - 'arte_cognition/test_executable_morphology.py'
      - '.github/workflows/arte-executable-morphology.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  morphology-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile morphology kernel
        run: |
          python -m py_compile arte_cognition/executable_morphology.py
          python -m py_compile arte_cognition/test_executable_morphology.py
      - name: Run morphology contract
        run: python -m unittest arte_cognition.test_executable_morphology -v
