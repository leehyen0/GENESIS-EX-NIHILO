name: arte-v57-target-free-surface-probe
on:
  push:
    branches: [arte-v57-source-disjoint-crossnovel]
    paths:
      - 'arte_external_replay/v57_failed_input_surface_probe.py'
      - '.github/workflows/arte-v57-target-free-surface-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe only failed input surface
        run: python arte_external_replay/v57_failed_input_surface_probe.py input_surface_probe.json
      - name: Assert target isolation
        shell: python
        run: |
          import json
          r=json.load(open('input_surface_probe.json'))
          assert r['target_scores_accessed'] is False and r['selected_index']==546
          print(json.dumps(r,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: arte-v57-input-surface-probe
          path: input_surface_probe.json
