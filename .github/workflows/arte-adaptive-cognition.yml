name: arte-adaptive-cognition

on:
  pull_request:
    branches: [main]
    paths:
      - 'arte_cognition/**'
      - 'evaluations/**'
      - '.github/workflows/arte-adaptive-cognition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cognition-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile cognition core
        run: |
          python -m py_compile arte_cognition/adaptive_cognition.py
          python -m py_compile arte_cognition/meta_router.py
          python -m py_compile arte_cognition/possibility_space.py
          python -m py_compile arte_cognition/semantic_genesis.py
          python -m py_compile arte_cognition/epistemic_memory.py
          python -m py_compile arte_cognition/causal_credit.py
          python -m py_compile arte_cognition/causal_law.py
          python -m py_compile arte_cognition/representation_genesis.py
          python -m py_compile arte_cognition/representation_value.py
          python -m py_compile arte_cognition/experiment_genesis.py
          python -m py_compile arte_cognition/subgraph_credit.py
          python -m py_compile arte_cognition/topology_learning.py
          python -m py_compile arte_cognition/validation_matrix.py
          python -m py_compile arte_cognition/world_coupling.py
          python -m py_compile arte_cognition/world_action_policy.py
          python -m py_compile arte_cognition/world_revision.py
          python -m py_compile arte_cognition/world_model_ecology.py
          python -m py_compile arte_cognition/cognitive_runtime.py
          python -m py_compile arte_cognition/body_checkpoint.py
          python -m py_compile arte_cognition/epistemic_depth_runtime.py
          python -m py_compile evaluations/run_hidden_world_coupling.py
          python -m py_compile evaluations/run_end_to_end_world_genesis.py
          python -m py_compile evaluations/run_descendant_phenotype_reconstruction.py
          python -m py_compile evaluations/run_world_caused_cognition_rewrite.py
          python -m py_compile evaluations/run_world_revision_causal_credit.py
          python -m py_compile evaluations/run_multi_episode_world_rewrite.py
          python -m py_compile evaluations/run_matched_descendant_search_acceleration.py
          python -m py_compile evaluations/run_epistemic_depth_expansion.py
      - name: Run cognition tests
        run: python -m unittest discover -s arte_cognition -p 'test_*.py' -v
      - name: Generate evaluator-owned hidden world seeds
        run: |
          python - <<'PY'
          import secrets
          from pathlib import Path
          Path('/tmp/arte_hidden_world_seed').write_text(str(secrets.randbits(128)))
          Path('/tmp/arte_end_to_end_seed').write_text(str(secrets.randbits(128)))
          Path('/tmp/arte_descendant_phenotype_seed').write_text(str(secrets.randbits(128)))
          Path('/tmp/arte_world_rewrite_seed').write_text(str(secrets.randbits(128)))
          Path('/tmp/arte_world_rewrite_credit_seed').write_text(str(secrets.randbits(128)))
          Path('/tmp/arte_multi_episode_rewrite_seed').write_text(str(secrets.randbits(128)))
          Path('/tmp/arte_matched_descendant_accel_seed').write_text(str(secrets.randbits(128)))
          Path('/tmp/arte_epistemic_depth_seed').write_text(str(secrets.randbits(128)))
          PY
      - name: Run hidden software-world descendant evaluation
        run: python evaluations/run_hidden_world_coupling.py /tmp/arte_hidden_world_seed
      - name: Run raw-residual to descendant world-genesis evaluation
        run: python evaluations/run_end_to_end_world_genesis.py /tmp/arte_end_to_end_seed
      - name: Run descendant phenotype reconstruction evaluation
        run: python evaluations/run_descendant_phenotype_reconstruction.py /tmp/arte_descendant_phenotype_seed
      - name: Run authenticated world-caused cognition rewrite evaluation
        run: python evaluations/run_world_caused_cognition_rewrite.py /tmp/arte_world_rewrite_seed
      - name: Run world rewrite REMOVE-ablation causal credit evaluation
        run: python evaluations/run_world_revision_causal_credit.py /tmp/arte_world_rewrite_credit_seed
      - name: Run multi-episode world rewrite persistence evaluation
        run: python evaluations/run_multi_episode_world_rewrite.py /tmp/arte_multi_episode_rewrite_seed
      - name: Run matched descendant search acceleration evaluation
        run: python evaluations/run_matched_descendant_search_acceleration.py /tmp/arte_matched_descendant_accel_seed
      - name: Run cost-tolerant causal-model depth expansion evaluation
        run: python evaluations/run_epistemic_depth_expansion.py /tmp/arte_epistemic_depth_seed
