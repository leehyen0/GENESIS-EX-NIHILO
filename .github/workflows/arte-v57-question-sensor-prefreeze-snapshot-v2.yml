name: arte-v57-question-sensor-prefreeze-snapshot-v2
on:
  push:
    paths:
      - '.github/workflows/arte-v57-question-sensor-prefreeze-snapshot-v2.yml'
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Produce verifier-complete candidate snapshot
        run: |
          mkdir -p prefreeze_v2
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          files=[
            'arte_candidate/run_v57_question_sensor_candidate.py',
            'arte_candidate/v57_epoch20_question_bank.json',
            'arte_custodian/v57_epoch20_independent_question_sensor_public_spec.json',
            'arte_custodian/v57_question_sensor_custodian_reference.py',
            'arte_custodian/v57_question_sensor_commitment_intake.py',
            'arte_custodian/v57_question_sensor_final_verifier.py'
          ]
          hs={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files}
          x={
            'schema':'arte.question_sensor_candidate_prefreeze_snapshot/v57-v2',
            'snapshot_head_sha':os.environ['GITHUB_SHA'],
            'candidate_content_anchor_commit':'71102843e7e7652fafa0319f480dc28944bd52ff',
            'epoch20_evidence_head_sha':'1c7483f946c75a24e38e887b4f1964effad40254',
            'body_state_sha256':'2b02b704147e95ad401110b98744f7ab54cb46f4b8b073ea9b20994dd0d8f257',
            'generated_operator_sha256':'23e1b2449c1d27eaf3546124eee57bb1a573f9ad1930b9dc9ce6ba28d17ad54f',
            'learned_question_bank_canonical_sha256':'cef2f2f365a9763c1966e4a62739aedbaae7c860ddd986d2b0e8c757603eb017',
            'files':hs,
            'interface_selftest_run_id':'33150695386',
            'e2e_verifier_selftest_run_id':'33150923904',
            'selftests_status':'PASS',
            'supersedes_prefreeze_snapshot_sha256':'339ba2c3823cae39b9e280b44d4f4d419dd8d5d614040b594f69a8e76c6e66b6',
            'formal_candidate_freeze':False,
            'freeze_allowed_without_valid_G1_G2_G3_commitment_batch':False,
            'independent_custody_proven':False,
            'AGI':False,'ASI':False
          }
          x['snapshot_sha256']=hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          Path('prefreeze_v2/candidate_prefreeze_snapshot_v2.json').write_text(json.dumps(x,indent=2,sort_keys=True)+'\n')
          print(json.dumps(x,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arte-v57-question-sensor-prefreeze-snapshot-v2
          path: prefreeze_v2
