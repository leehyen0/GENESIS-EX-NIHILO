name: arte-large-scale-external-ecology

on:
  pull_request:
    paths:
      - 'arte_cognition/external_ecology.py'
      - 'arte_cognition/test_external_ecology.py'
      - 'evaluations/run_large_scale_external_ecology.py'
      - 'evaluations/large_scale_external_ecology_contract.json'
      - 'research/ARTE_LARGE_SCALE_EXTERNAL_ECOLOGY_20260823.md'
      - '.github/workflows/arte-large-scale-external-ecology.yml'
  push:
    branches:
      - arte-large-scale-external-ecology-shadow
    paths:
      - 'arte_cognition/external_ecology.py'
      - 'arte_cognition/test_external_ecology.py'
      - 'evaluations/run_large_scale_external_ecology.py'
      - 'evaluations/large_scale_external_ecology_contract.json'
      - 'research/ARTE_LARGE_SCALE_EXTERNAL_ECOLOGY_20260823.md'
      - '.github/workflows/arte-large-scale-external-ecology.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-ecology:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile external ecology cognition layer
        run: |
          python -m py_compile arte_cognition/external_ecology.py
          python -m py_compile arte_cognition/test_external_ecology.py
          python -m py_compile evaluations/run_large_scale_external_ecology.py

      - name: Verify frozen large-scale contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('evaluations/large_scale_external_ecology_contract.json').read_text())
          assert c['canonical_parent'] == 'f3840760cfc0b5b7eac1e03b4d0f9874b0d1d6b0'
          assert c['candidate_consequences_used_for_acquisition'] is False
          assert c['hidden_cohort_candidate_count'] == 72
          assert c['minimum_prospective_transitions'] == 3
          assert c['minimum_more_compute_repeats_for_external_inexpressibility'] == 16
          assert c['global_recursive_acceleration_self_certification'] is False
          assert c['AGI'] is False and c['ASI'] is False
          PY

      - name: Run external ecology contracts
        run: python -m unittest arte_cognition.test_external_ecology -v

      - name: Generate evaluator-owned hidden cohort seed
        run: |
          python - <<'PY'
          import secrets
          from pathlib import Path
          Path('/tmp/arte_external_ecology_seed').write_text(str(secrets.randbits(128)))
          PY

      - name: Run hidden large-scale multi-ecology evaluation
        run: PYTHONPATH=. python evaluations/run_large_scale_external_ecology.py /tmp/arte_external_ecology_seed
