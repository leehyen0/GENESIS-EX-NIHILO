name: arte-generated-feature-predicate-action-chain

on:
  push:
    branches:
      - agent/generative-large-scale-campaign-20260929
    paths:
      - 'evaluations/run_generated_feature_predicate_action_chain.py'
      - '.github/workflows/arte-generated-feature-predicate-action-chain.yml'
      - 'research/ARTE_GENERATED_FEATURE_PREDICATE_ACTION_CHAIN_PRECOMMIT_20260929.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seed: [20260929931, 20260929932, 20260929933, 20260929934, 20260929935]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute generated feature-predicate-action chain
        run: |
          mkdir -p artifacts/generated-feature-predicate-action
          set -o pipefail
          PYTHONPATH=. python evaluations/run_generated_feature_predicate_action_chain.py --seed ${{ matrix.seed }} | tee artifacts/generated-feature-predicate-action/result-${{ matrix.seed }}.jsonl
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-feature-predicate-action-${{ matrix.seed }}
          path: artifacts/generated-feature-predicate-action/
          if-no-files-found: error
          retention-days: 30
